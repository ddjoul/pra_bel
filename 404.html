<!DOCTYPE html>
<html lang="be">
<head>

  <title>сайт часова недаступны / пра.бел</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f7f5ef;
      color: #242424;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 600px;

    h1 {

      line-height: 1.2;

    .description {
      margin: 0;
      font-size: 18px;
      line-height: 1.6;
      color: #606060;
    }

<body>
  <main>
    <p class="brand">пра.бел</p>
    <h1>сайт часова недаступны</h1>

</html>
